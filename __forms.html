<!-- ضع هذا الملف باسم __forms.html في جذر موقعك (بجانب index.html) ثم أعد النشر على Netlify -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>forms</title></head>
<body hidden>
<form name="scans" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="scans">
  <input name="bot-field">
  <input name="op_id">
  <input name="name">
  <input name="phone">
  <input name="folder">
  <input name="total">
  <input name="flagged">
  <textarea name="flagged_files"></textarea>
</form>
</body></html>
